<a mat-button routerLink="/sales/index">Back to sales</a>
@if (sale(); as item) {
  <h1>{{ item.reference }}</h1>
  <p>{{ item.description }}</p>
  <app-cattle-reservation [sale]="item" (saleUpdated)="sale.set($event)" />
} @else if (failed()) {
  <h1>Sale could not be loaded</h1>
  <p>Choose a cattle sale from Sales.</p>
} @else {
  <p role="status">Loading cattle sale...</p>
}
