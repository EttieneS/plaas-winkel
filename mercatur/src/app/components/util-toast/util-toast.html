<div class="toast" [class]="'toast toast-' + data.type">
  <span class="toast-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round">
      <path [attr.d]="icons[data.type]" />
    </svg>
  </span>
  <div class="toast-content" matSnackBarLabel>
    <strong class="toast-title">{{ data.type }}</strong>
    <p class="toast-message">{{ data.message }}</p>
  </div>
  <button type="button" class="toast-close" aria-label="Dismiss notification" (click)="dismiss()">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12 M18 6L6 18" /></svg>
  </button>
</div>
